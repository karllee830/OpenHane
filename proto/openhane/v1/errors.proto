syntax = "proto3";

package openhane.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_VERSION_UNSUPPORTED = 1;
  ERROR_CODE_AUTH_FAILED = 2;
  ERROR_CODE_TLS_MITM_SUSPECTED = 3;
  ERROR_CODE_BANNED = 4;
  ERROR_CODE_PASSWORD_REQUIRED = 5;
  ERROR_CODE_PASSWORD_INVALID = 6;
  ERROR_CODE_SERVER_FULL = 7;
  ERROR_CODE_SECURITY_LEVEL_TOO_LOW = 8;
  ERROR_CODE_NICKNAME_INVALID = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  ERROR_CODE_PERMISSION_DENIED = 11;
  ERROR_CODE_ROOM_NOT_FOUND = 12;
  ERROR_CODE_ROOM_FULL = 13;
  ERROR_CODE_ROOM_LOCKED = 14;
  ERROR_CODE_ROOM_PASSWORD_INVALID = 15;
  ERROR_CODE_SHARE_LIMIT_REACHED = 16;
  ERROR_CODE_TOKEN_INVALID = 17;
  ERROR_CODE_TOKEN_EXPIRED = 18;
  ERROR_CODE_TOKEN_USED_UP = 19;
  ERROR_CODE_E2EE_UNSUPPORTED = 20;
  ERROR_CODE_INVALID_ARGUMENT = 21;
  ERROR_CODE_INTERNAL = 22;
  // 以下用于 Goodbye
  ERROR_CODE_KICKED = 40;
  ERROR_CODE_SERVER_SHUTTING_DOWN = 41;
  ERROR_CODE_SESSION_REPLACED = 42;
  ERROR_CODE_SLOW_CONSUMER = 43;
  ERROR_CODE_TIMEOUT = 44;
}

message Error {
  ErrorCode code = 1;
  // 面向开发者的说明；面向用户的文案由客户端按 code 本地化。
  string message = 2;
  // RATE_LIMITED 时有效
  uint32 retry_after_ms = 3;
  // BANNED 时有效
  string ban_reason = 4;
  int64 ban_expires_at_ms = 5; // 0 表示永久
  // PROTOCOL_VERSION_UNSUPPORTED 时有效
  uint32 protocol_min = 6;
  uint32 protocol_max = 7;
  // SECURITY_LEVEL_TOO_LOW 时有效
  uint32 required_security_level = 8;
  // KICKED / BANNED 时有效：执行操作的主持人昵称和填写的原因
  string by_name = 9;
  string reason = 10;
}
