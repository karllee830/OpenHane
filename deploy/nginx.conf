# 由 Nginx 负责 HTTPS，羽见以 HANE_TLS_MODE=off 运行在本机。放进 /etc/nginx/conf.d/ 即可（http 上下文）。
# 媒体（UDP 9800、TCP 9801）不经过 Nginx，仍需在防火墙放行；9800/tcp 只需对本机开放。
#
# 羽见的环境变量：
#   HANE_TLS_MODE=off
#   HANE_PUBLIC_HOST=<服务器的真实 IP>   # 只在域名套了 CDN 时需要
#   HANE_TRUSTED_PROXIES=127.0.0.1/32      # 从 X-Forwarded-For 取客户端真实 IP（封禁、限流按它判断）
#
# 证书路径按 certbot 的默认位置写，换成自己的即可。
# 客户端连接地址：meet.example.com 或 https://meet.example.com（网页版直接打开后者）

# 控制连接（/ws）和媒体信令（/rtc）都是 WebSocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name meet.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name meet.example.com;

	ssl_certificate     /etc/letsencrypt/live/meet.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/meet.example.com/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:9800;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		# 保留客户端填写的域名：服务端按它确定媒体地址（Nginx 默认改成 127.0.0.1，媒体可能连不上）
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 长连接：客户端每 15 秒发一次心跳，超时留足余量
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}
